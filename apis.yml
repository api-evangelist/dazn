aid: dazn
name: DAZN
description: >-
  DAZN is a global over-the-top live sports streaming service headquartered in London and owned by
  Access Industries. Launched in 2015 out of the former Perform Group, it streams boxing, football,
  MotoGP, UFC and other rights to subscribers across more than 200 countries and territories, and has
  expanded through the acquisitions of Eleven Group, Foxtel/Kayo Sports and ViewLift, alongside the
  DAZN Bet and DAZN Media brands. DAZN operates a large Node.js microservice estate on AWS and
  publishes open source engineering tooling (the Kopytko Roku ecosystem, dazn-lambda-powertools) from
  its GitHub organization, but it runs no public developer program: there is no developer portal, no
  API reference, and no machine-readable specification for the consumer platform APIs that power its
  apps.
